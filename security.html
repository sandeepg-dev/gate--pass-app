<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Gate Security Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700 text-center">
        
        <div class="flex items-center justify-between mb-3">
            <h1 class="text-lg font-bold text-emerald-400">⚡ Instant Gate Scanner</h1>
            <span id="scanStatus" class="bg-emerald-500/20 text-emerald-300 text-xs px-2.5 py-1 rounded-full border border-emerald-500/30 font-mono">
                Sensor Ready
            </span>
        </div>

        <p class="text-xs text-slate-400 mb-3">Place barcode across the red line (keep 15–25 cm distance)</p>

        <div class="relative overflow-hidden rounded-xl bg-black border-2 border-emerald-500 mb-4 h-[240px] flex items-center justify-center">
            <video id="video" autoplay playsinline muted class="w-full h-full object-cover"></video>
            
            <div class="absolute inset-x-0 top-1/2 -translate-y-1/2 h-0.5 bg-red-500 pointer-events-none shadow-[0_0_12px_red]"></div>
        </div>

        <div id="scanResult" class="hidden p-4 rounded-xl font-bold text-xs mb-4 text-left shadow-lg"></div>

        <div class="pt-3 border-t border-slate-700">
            <form onsubmit="handleManualSubmit(event)" class="flex gap-2">
                <input type="text" id="manualRoll" autofocus placeholder="Enter ID e.g. 110324104107" class="w-full p-2.5 rounded-lg bg-slate-700 border border-slate-600 text-white text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 font-mono">
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 px-5 py-2.5 rounded-lg text-xs font-bold transition">Verify</button>
            </form>
        </div>
    </div>

    <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- Modular Scanner Script -->
    <script src="/js/scanner.js"></script>
</body>
</html>
